&lt;section class=&quot;studio-story studio-light studio-faq&quot;&gt;&lt;div class=&quot;layout-wrap&quot;&gt;&lt;span class=&quot;eyebrow&quot;&gt;QUICK ANSWERS&lt;/span&gt;&lt;h2&gt;Before we &lt;em&gt;start.&lt;/em&gt;&lt;/h2&gt;&lt;details&gt;&lt;summary&gt;Will my store go offline while you work?&lt;/summary&gt;&lt;p&gt;No. I build on a draft copy of your theme. Your live store keeps selling until you approve the switch.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Do I need Shopify Plus?&lt;/summary&gt;&lt;p&gt;Most storefront work runs on other plans. Some custom Shopify Functions and certain advanced B2B features require Plus. I check the plan before proposing anything.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Can my team edit the store after you finish?&lt;/summary&gt;&lt;p&gt;Yes. I build editable theme sections and provide handover notes.&lt;/p&gt;&lt;/details&gt;&lt;a class=&quot;story-more&quot; href=&quot;/faqs/&quot;&gt;More questions ↗&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;
