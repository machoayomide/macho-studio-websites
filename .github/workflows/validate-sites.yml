name: Validate static sites

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify each deployable site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          roots = [Path("sites/main"), Path("sites/shopify")]
          missing = []
          for root in roots:
              index = root / "index.html"
              if not index.is_file():
                  missing.append(str(index))
                  continue
              html = index.read_text(encoding="utf-8")
              if "<html" not in html.lower():
                  missing.append(f"{index}: invalid HTML")
              print(f"{root}: {sum(1 for p in root.rglob('*') if p.is_file())} files")
          if missing:
              print("Static site validation failed:", ", ".join(missing))
              sys.exit(1)
          PY
