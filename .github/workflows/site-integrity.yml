name: MACHO Site Integrity
on:
  push:
    branches: [main]
    paths:
      - "main/**"
      - "shopify/**"
      - "tests/**"
      - ".github/workflows/site-integrity.yml"
  pull_request:
    branches: [main]
    paths:
      - "main/**"
      - "shopify/**"
      - "tests/**"
      - ".github/workflows/site-integrity.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify routes, SEO, dialogs and visitor-activity backend
        run: node --test tests/*.test.mjs
